<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Fashion Collections | ChicStack</title>
    <meta name="description" content="Browse our latest fashion collections for men and women. Trendy clothing, accessories and more at ChicStack.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/header-footer.css">
    <link rel="stylesheet" href="../assets/css/shop.css">
</head>
<body>
    <!-- Header loaded via JS -->
    <div id="header-placeholder"></div>

    <main class="shop-page">
        <!-- Hero Section -->
        <section class="shop-hero">
            <div class="container">
                <h1>Our Collections</h1>
                <p>Discover the latest trends in fashion</p>
            </div>
        </section>

        <!-- Products Section -->
        <section class="products-section">
            <div class="container">
                <!-- Filter/Sort Options -->
                <div class="shop-controls">
                    <div class="filter-toggle">
                        <button id="filter-toggle">Filters <i class="fas fa-sliders-h"></i></button>
                    </div>
                    <div class="sort-options">
                        <label for="sort">Sort by:</label>
                        <select id="sort">
                            <option value="default">Default</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="name-asc">Name: A-Z</option>
                            <option value="name-desc">Name: Z-A</option>
                            <option value="newest">Newest</option>
                        </select>
                    </div>
                </div>

                <!-- Filter Sidebar and Products Grid -->
                <div class="shop-content">
                    <!-- Filter Sidebar -->
                    <aside id="filter-sidebar" class="filter-sidebar">
                        <div class="sidebar-header">
                            <h3>Filters</h3>
                            <button id="close-filters"><i class="fas fa-times"></i></button>
                        </div>
                        
                        <div class="filter-group">
                            <h4>Price Range</h4>
                            <div class="price-filter">
                                <input type="range" id="price-range" min="0" max="200" value="200">
                                <p>Max: <span id="price-max">€200</span></p>
                            </div>
                        </div>
                        
                        <div class="filter-group">
                            <h4>Categories</h4>
                            <ul class="filter-list">
                                <li>
                                    <input type="checkbox" id="category-women" checked>
                                    <label for="category-women">Women</label>
                                </li>
                                <li>
                                    <input type="checkbox" id="category-men" checked>
                                    <label for="category-men">Men</label>
                                </li>
                                <li>
                                    <input type="checkbox" id="category-accessories" checked>
                                    <label for="category-accessories">Accessories</label>
                                </li>
                            </ul>
                        </div>
                        
                        <div class="filter-group">
                            <h4>Size</h4>
                            <div class="size-filters">
                                <button class="size-btn active" data-size="XS">XS</button>
                                <button class="size-btn" data-size="S">S</button>
                                <button class="size-btn" data-size="M">M</button>
                                <button class="size-btn" data-size="L">L</button>
                                <button class="size-btn" data-size="XL">XL</button>
                            </div>
                        </div>
                        
                        <div class="filter-group">
                            <h4>Color</h4>
                            <div class="color-filters">
                                <button class="color-btn active" data-color="red" style="background-color: red"></button>
                                <button class="color-btn" data-color="blue" style="background-color: blue"></button>
                                <button class="color-btn" data-color="green" style="background-color: green"></button>
                                <button class="color-btn" data-color="black" style="background-color: black"></button>
                                <button class="color-btn" data-color="white" style="background-color: white; border: 1px solid #ccc"></button>
                            </div>
                        </div>
                        
                        <div class="filter-actions">
                            <button class="btn apply-filters">Apply Filters</button>
                            <button class="btn reset-filters">Reset</button>
                        </div>
                    </aside>
                    
                    <!-- Products Grid -->
                    <div class="products-grid"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer loaded via JS -->
    <div id="footer-placeholder"></div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/shop.js"></script>
</body>
</html>
