<header>
    <div class="container header-container">
        <a href="/" class="logo">Chic<span>Stack</span></a>
        
        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-expanded="false" aria-label="Toggle navigation">
            <span class="hamburger-box">
                <span class="hamburger-inner"></span>
            </span>
        </button>
        
        <nav id="main-nav" aria-hidden="true">
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/shop/" class="nav-link">Shop</a></li>
                <li><a href="/about/" class="nav-link">About</a></li>
                <li><a href="/blog/" class="nav-link">Blog</a></li>
                <li><a href="/faq/" class="nav-link">FAQs</a></li>
                <li><a href="/contact/" class="nav-link">Contact</a></li>
                
                <li class="cart-nav-item">
                    <a href="#" class="cart-icon" id="cart-toggle" aria-label="Shopping cart">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

<!-- Cart Modal -->
<div class="cart-modal" id="cart-modal">
    <div class="cart-content">
        <div class="cart-header">
            <h3>Your Shopping Cart</h3>
            <button id="close-cart" aria-label="Close cart"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items will be loaded here -->
        </div>
        <div class="cart-summary">
            <div class="cart-total">
                <span>Total:</span>
                <span class="total-price">€0.00</span>
            </div>
            <button class="btn checkout-btn">Proceed to Checkout</button>
        </div>
    </div>
</div>
